<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="description" content="Convite para o aniversário de 1 aninho da Liz: sábado, 21 de novembro, às 18h.">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="Aniversário de 1 aninho da Liz">
<meta property="og:description" content="Venha celebrar o primeiro aninho da nossa princesa! 21 de novembro, às 18h.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aniversário de 1 aninho da Liz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky-a:#ffd1e3;--sky-b:#f6dcf3;--sky-c:#d9ecff;
  --ink:#4a2b5c;--soft:#7a5a8c;--card:rgba(255,255,255,.7);--line:rgba(217,164,65,.6);
  --rose:#e0709a;--gold-a:#f9e08b;--gold-b:#d9a441;--gold-text:#c48a1c;
  --castle:#d9b8f0;--win:#fff0b8;--star:#f3c24f;--box:rgba(255,255,255,.75);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  background-color:var(--sky-b);
  background-image:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 55%,var(--sky-c) 100%);
  color:var(--ink);
  font-family:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-weight:500;line-height:1.5;overflow-x:hidden;
}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#sky i{
  position:absolute;display:block;background:var(--star);opacity:.15;
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  animation:tw 3s ease-in-out infinite;
}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6) rotate(0)}50%{opacity:.9;transform:scale(1) rotate(20deg)}}

main{position:relative;z-index:1;max-width:30rem;margin:0 auto;padding:2.5rem 1.5rem 3rem;text-align:center}

.crown-wrap{width:9.5rem;margin:0 auto;animation:float 4.5s ease-in-out 1.6s infinite}
.crown{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 6px 14px rgba(217,164,65,.45));animation:drop 1.2s cubic-bezier(.3,1.3,.5,1) both}
@keyframes drop{
  0%{transform:translateY(-150px) rotate(-14deg);opacity:0}
  55%{opacity:1}
  100%{transform:none;opacity:1}
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rise{animation:rise .9s ease both;animation-delay:var(--d,0s)}

.kicker{margin:1rem auto 0;max-width:19rem;font-size:1.05rem;color:var(--soft)}
h1{
  margin:.2rem 0 0;font-family:"Pinyon Script","Snell Roundhand",cursive;font-weight:400;
  font-size:clamp(6rem,30vw,9.5rem);line-height:1;color:var(--rose);
  text-shadow:2px 3px 0 rgba(217,164,65,.45);
}
.age{margin:0;font-weight:700;font-size:1.45rem;letter-spacing:.02em}

.card{
  margin:2rem auto 0;padding:1.5rem 1.25rem;border:1.5px solid var(--line);border-radius:28px;
  background:var(--card);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.when{display:flex;align-items:center;justify-content:center;gap:1.1rem}
.num{display:inline-block;font-family:"Pinyon Script","Snell Roundhand",cursive;font-size:6rem;line-height:.9;color:var(--gold-text);transform:skewX(15deg)}
.txt{display:flex;flex-direction:column;text-align:left;line-height:1.3}
.txt span{color:var(--soft)}
.txt strong{font-size:1.45rem;font-weight:700}
.txt .time{margin-top:.2rem;font-size:1.25rem;font-weight:700;color:var(--rose)}

.place{margin-top:1.5rem;padding-top:1.4rem;border-top:1.5px dashed var(--line)}
.place .pin{display:block;margin:0 auto .35rem;color:var(--gold-text)}
.place strong{display:block;font-size:1.15rem;font-weight:700;line-height:1.3}
.place span{display:block;margin-top:.15rem;color:var(--soft);font-size:.98rem}
.map-btn{
  display:inline-block;margin-top:.9rem;padding:.55rem 1.3rem;border:1.5px solid var(--gold-b);border-radius:999px;
  color:var(--ink);text-decoration:none;font-weight:700;font-size:.95rem;
  transition:background-color .25s ease,transform .25s ease;
}
.map-btn:hover,.map-btn:focus-visible{background:rgba(217,164,65,.18);transform:translateY(-1px)}
.map-btn:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.count{margin-top:1.75rem}
.count p{margin:0 0 .6rem;color:var(--soft)}
.boxes{display:flex;justify-content:center;gap:.6rem}
.box{min-width:4.2rem;padding:.55rem .4rem;border:1.5px solid var(--line);border-radius:18px;background:var(--box)}
.box b{display:block;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.box small{font-size:.8rem;color:var(--soft)}
.today{margin:0;font-weight:700;font-size:1.25rem;color:var(--rose)}

.btn{
  position:relative;overflow:hidden;display:inline-block;margin-top:2rem;padding:1rem 2.4rem;
  border-radius:999px;text-decoration:none;font-weight:700;font-size:1.1rem;color:#4a2b5c;
  background:linear-gradient(135deg,var(--gold-a),var(--gold-b));
  box-shadow:0 8px 20px rgba(217,164,65,.45);
  transition:transform .25s ease,box-shadow .25s ease;
}
.btn::after{
  content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);
  transform:skewX(-20deg);transition:left .7s ease;
}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);box-shadow:0 12px 26px rgba(217,164,65,.55)}
.btn:hover::after,.btn:focus-visible::after{left:130%}
.btn:focus-visible{outline:3px solid var(--rose);outline-offset:4px}
.btn:active{transform:translateY(0)}
.note{min-height:1.5rem;margin:.9rem 0 0;font-size:.95rem;color:var(--soft)}

footer{position:relative;z-index:1;margin-top:1rem}
.castle{display:block;width:100%;max-width:40rem;height:auto;margin:0 auto -1px}
.castle .win{animation:glow 4s ease-in-out infinite}
.castle .win:nth-of-type(2n){animation-delay:1.4s}
@keyframes glow{0%,100%{opacity:.7}50%{opacity:1}}
.ground{height:2.5rem;background:var(--castle)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  #sky i{opacity:.5}
}
</style>
</head>
<body>

<main>

          <stop offset="0" stop-color="#fbe9a0"/><stop offset=".55" stop-color="#e8b84e"/><stop offset="1" stop-color="#c9902c"/>
        </linearGradient>
      </defs>

</main>

      <line x1="285" y1="48" x2="285" y2="30"/><line x1="50" y1="86" x2="50" y2="70"/><line x1="350" y1="86" x2="350" y2="70"/>
    </g>
    <g fill="var(--rose)">
      <polygon points="200,-14 217,-8 200,-2"/><polygon points="115,30 130,35 115,40"/>
      <polygon points="285,30 300,35 285,40"/><polygon points="50,70 63,74 50,78"/><polygon points="350,70 363,74 350,78"/>
    </g>
    <g fill="var(--win)">
      <rect class="win" x="192" y="84" width="16" height="26" rx="8"/>

      <path class="win" d="M186 156 v-18 a14 14 0 0 1 28 0 v18 z"/>

  </svg>
  <div class="ground"></div>
</footer>

<script>
(function(){
  // Cole aqui o link do Google Forms quando estiver pronto.
  var FORM_URL = "https://forms.gle/Y8YSbNmgzYHkEADa8";

  var rsvp = document.getElementById("rsvp");
  var note = document.getElementById("note");
  if (FORM_URL) {
    rsvp.href = FORM_URL;
  } else {
    rsvp.addEventListener("click", function(e){
      e.preventDefault();
      note.textContent = "O formulário de confirmação estará disponível em breve.";
    });
  }

  var sky = document.getElementById("sky");
  var total = window.matchMedia("(max-width:600px)").matches ? 22 : 34;
  for (var i = 0; i < total; i++) {
    var s = document.createElement("i");
    var size = 6 + Math.random() * 14;
    s.style.cssText = "left:" + (Math.random() * 100) + "%;top:" + (Math.random() * 100) + "%;" +
      "width:" + size + "px;height:" + size + "px;" +
      "animation-delay:" + (Math.random() * 4) + "s;animation-duration:" + (2.5 + Math.random() * 3) + "s";
    sky.appendChild(s);
  }

  var target = new Date(2026, 10, 21, 18, 0, 0);
  var els = {d:document.getElementById("d"), h:document.getElementById("h"), m:document.getElementById("m"), s:document.getElementById("s")};
  var box = document.getElementById("count");
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function tick(){
    var diff = target - new Date();
    if (diff <= 0) {
      box.innerHTML = '<p class="today">A festa começou! Vamos celebrar a Liz.</p>';
      clearInterval(timer);
      return;
    }
    var t = Math.floor(diff / 1000);
    els.d.textContent = Math.floor(t / 86400);
    els.h.textContent = pad(Math.floor(t % 86400 / 3600));
    els.m.textContent = pad(Math.floor(t % 3600 / 60));
    els.s.textContent = pad(t % 60);
  }
  var timer = setInterval(tick, 1000);
  tick();
})();
</script>
</body>
</html>
